<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img"
     aria-label="Владимир Чуев — Backend-разработчик: FastAPI, PostgreSQL, Redis, Docker, asyncio">
  <!-- Палитра Rosé Pine, та же, что на сайте. Всё внутри файла: GitHub
       проксирует картинку через camo, внешние ресурсы не подгрузятся. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#eb6f92"/>
      <stop offset="45%" stop-color="#c4a7e7"/>
      <stop offset="100%" stop-color="#9ccfd8"/>
      <animate attributeName="x1" values="0;-0.6;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1"  dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowLove" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eb6f92" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#eb6f92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a7e7" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#c4a7e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#31748f" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#31748f" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card">
      <rect x="0" y="0" width="780" height="300" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="780" height="300" fill="#191724"/>

    <!-- Аврора: медленно дышащие пятна, как на сайте -->
    <g>
      <ellipse cx="110" cy="20" rx="290" ry="220" fill="url(#glowLove)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 45 25; 0 0" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="690" cy="40" rx="260" ry="200" fill="url(#glowIris)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; -40 35; 0 0" dur="20s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="420" cy="320" rx="340" ry="190" fill="url(#glowPine)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 35 -25; 0 0" dur="24s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Звёздная пыль -->
    <g fill="#e0def4">
      <circle cx="96"  cy="240" r="1.6" opacity=".35"><animate attributeName="opacity" values=".35;.9;.35" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="58"  r="1.2" opacity=".25"><animate attributeName="opacity" values=".25;.7;.25" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="44"  r="1.4" opacity=".3"><animate attributeName="opacity" values=".3;.85;.3" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="248" r="1.3" opacity=".28"><animate attributeName="opacity" values=".28;.75;.28" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="742" cy="118" r="1.5" opacity=".3"><animate attributeName="opacity" values=".3;.8;.3" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="392" cy="272" r="1.2" opacity=".22"><animate attributeName="opacity" values=".22;.65;.22" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <!-- Имя -->
      <text x="56" y="112" font-size="60" font-weight="800" letter-spacing="-1.8"
            fill="url(#accent)">Владимир Чуев</text>

      <!-- Роль -->
      <text x="56" y="150" font-size="20" font-weight="600" fill="#908caa" letter-spacing="0.2">
        Backend-разработчик · Middle · Санкт-Петербург
      </text>

      <!-- Стек -->
      <text x="56" y="186" font-size="14.5" fill="#6e6a86" letter-spacing="1.2"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        FastAPI · PostgreSQL · Redis · Docker · asyncio · WebSockets
      </text>

      <!-- Метрики -->
      <g transform="translate(56, 212)">
        <g>
          <rect x="0" y="0" width="212" height="56" rx="16" fill="#1f1d2e" fill-opacity=".85"
                stroke="#e0def4" stroke-opacity=".12"/>
          <text x="22" y="25" font-size="17" font-weight="700" font-style="italic" fill="#eb6f92">3 года</text>
          <text x="22" y="43" font-size="12" fill="#6e6a86">коммерческого опыта</text>
        </g>
        <g transform="translate(228, 0)">
          <rect x="0" y="0" width="212" height="56" rx="16" fill="#1f1d2e" fill-opacity=".85"
                stroke="#e0def4" stroke-opacity=".12"/>
          <text x="22" y="25" font-size="17" font-weight="700" font-style="italic" fill="#c4a7e7">800 → 120 мс</text>
          <text x="22" y="43" font-size="12" fill="#6e6a86">ответ критичных ручек</text>
        </g>
        <g transform="translate(456, 0)">
          <rect x="0" y="0" width="212" height="56" rx="16" fill="#1f1d2e" fill-opacity=".85"
                stroke="#e0def4" stroke-opacity=".12"/>
          <text x="22" y="25" font-size="17" font-weight="700" font-style="italic" fill="#9ccfd8">~75 %</text>
          <text x="22" y="43" font-size="12" fill="#6e6a86">покрытие тестами</text>
        </g>
      </g>
    </g>

    <!-- Акцентная линия по нижнему краю -->
    <rect x="0" y="296" width="780" height="4" fill="url(#accent)"/>
    <rect x="0" y="0" width="780" height="300" rx="26" fill="none"
          stroke="#e0def4" stroke-opacity=".1" stroke-width="2"/>
  </g>
</svg>
